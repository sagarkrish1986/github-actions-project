name: Java CI/CD Pipeline to Tomcat
 
on:
  push:
    branches: [main]
 
jobs:
  build:
    runs-on: [self-hosted, linux]
    environment: production
 
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
 
      # 2. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      # 3. Install Maven if missing
      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found. Installing..."
            sudo dnf install -y maven
          else
            echo "Maven is already installed"
          fi
 
          mvn -version
 
      # 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
 
      # 5. Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests
 
      # 6. Upload WAR as artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
 
      # 7. SonarQube Analysis
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "SonarQube server URL: $SONAR_HOST"
 
          if [ -z "$SONAR_HOST" ]; then
            echo "ERROR: SONAR_HOST secret is not configured"
            exit 1
          fi
 
          if [ -z "$SONAR_LOGIN" ]; then
            echo "ERROR: SONAR_TOKEN secret is not configured"
            exit 1
          fi
 
          echo "Checking SonarQube connectivity..."
          curl -f -I "$SONAR_HOST"
 
          echo "Running SonarQube analysis..."
 
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.2.4237:sonar
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.login="$SONAR_LOGIN"
 
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
 
    steps:
      # 8. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
 
      # 9. Deploy WAR via Tomcat Manager
      - name: Deploy to Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          WAR_FILE=$(ls *.war)
 
          echo "Deploying $WAR_FILE to Tomcat..."
 
          curl -v \
            --upload-file "$WAR_FILE" \
            "http://${TOMCAT_USER}:${TOMCAT_PASSWORD}@${TOMCAT_HOST}/manager/text/deploy?path=/myapp&update=true"
 
      # 10. Verify deployment
      - name: Verify deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          curl -I "http://${TOMCAT_HOST}/myapp"
